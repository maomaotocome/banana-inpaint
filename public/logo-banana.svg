<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="bananaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FACC15;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EAB308;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Banana Symbol -->
  <g transform="translate(10, 15) scale(0.7)">
    <path d="M20,70 C30,90 70,90 85,45 C90,30 80,10 70,5 C75,15 70,30 60,40 C50,50 30,55 20,70 Z" fill="url(#bananaGradient)" filter="url(#glow)" />
    <circle cx="75" cy="15" r="3" fill="#422006" />
    <path d="M72,12 L78,8" stroke="#422006" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Text: BananaPro -->
  <text x="90" y="65" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#FACC15">Banana<tspan fill="#22D3EE">Pro</tspan></text>
</svg>
